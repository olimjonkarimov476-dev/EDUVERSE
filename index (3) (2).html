<style>
:root[data-theme=light]{--bg:#f4f8f8;--sf:#fff;--rs:#ebf3f3;--ink:#102428;--mu:#52696e;--ln:#d0dfe1;--tl:#0f766e;--ti:#fff;--vi:#6d52a0;--dg:#b91c1c;--ok:#15803d}
:root[data-theme=dark]{--bg:#0b161a;--sf:#112025;--rs:#1a2e34;--ink:#e6f2f2;--mu:#9cb6bb;--ln:#2a4249;--tl:#5ecfc4;--ti:#061e21;--vi:#b7a4e8;--dg:#fca5a5;--ok:#86efac}
*{box-sizing:border-box;transition:background-color .15s,border-color .15s,color .15s}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:3px solid var(--vi);outline-offset:2px;border-radius:6px}
header{background:var(--sf);border-bottom:1px solid var(--ln)}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.25rem;color:var(--tl);letter-spacing:-.02em}
nav,.tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-weight:500;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:40px}
nav button[aria-current=page]{background:var(--rs);color:var(--ink)}
main{max-width:1000px;margin:auto;padding:28px 16px 60px}
h1{font-size:1.8rem;letter-spacing:-.02em;margin:0 0 6px}h2{font-size:1.2rem;margin:0 0 6px}
.mu{color:var(--mu)}.sm{font-size:.88rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.narrow{max-width:440px;margin:auto}.wide{max-width:680px}
label{display:block;font-size:.9rem;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);font:inherit}
.tools select{width:auto;min-height:38px;padding:2px 8px}
.btn{min-height:44px;padding:8px 18px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.btn.p{background:var(--tl);color:var(--ti);border-color:var(--tl)}.btn.p:hover{filter:brightness(1.1)}
.btn.d{border-color:var(--dg);color:var(--dg)}.btn.s{min-height:34px;padding:2px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}.full{width:100%;margin-top:16px}
.err{color:var(--dg);font-size:.92rem;margin:6px 0 0}.ok{color:var(--ok)}
.banner{background:var(--rs);border-left:4px solid var(--vi);padding:8px 14px;font-size:.88rem;color:var(--mu);border-radius:0 8px 8px 0;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:12px 0 0}
.chip{min-height:36px;padding:4px 16px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tl);color:var(--ti);border-color:var(--tl)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.sp{justify-content:space-between}
.track{height:10px;background:var(--rs);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--tl)}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{min-height:48px;text-align:left;padding:8px 14px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--tl)}.opt.good{border-color:var(--ok);background:var(--rs)}.opt.bad{border-color:var(--dg)}
.tag{display:inline-block;font-size:.78rem;padding:1px 10px;border-radius:99px;background:var(--rs);color:var(--mu);margin-right:6px}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--ln);padding:12px 0}
.item:first-child{border-top:0}
.chat{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--tl);color:var(--ti)}.msg.b{background:var(--rs)}
.danger{border-color:var(--dg)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
.shell{display:flex;min-height:100vh}
aside{width:232px;flex:none;background:linear-gradient(180deg,#1b1740,#0d0b24);color:#e8e6ff;padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid #ffffff22}
.brand .lg,.av{width:34px;height:34px;border-radius:10px;background:#b7a4e8;color:#1b1740;display:grid;place-items:center;font-weight:800;flex:none}
.brand small{display:block;font-size:.72rem;color:#a9a5d4;line-height:1.2}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1}
aside nav button{color:#cfcdf0;text-align:left;width:100%}
aside nav button:hover{background:#ffffff12}
aside nav button[aria-current=page]{background:#ffffff1f;color:#fff}
#ucard{background:#ffffff14;border-radius:14px;padding:12px}
#ucard .track{background:#ffffff26}#ucard .fill{background:#b7a4e8}
.col{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--ln);background:var(--sf)}
.top h1{margin:0;font-size:1.25rem}
.pill{padding:3px 12px;border-radius:99px;font-size:.85rem;font-weight:600;border:1px solid}
.pill.xp{background:#fdf0c8;color:#7a5600;border-color:#e8c766}.pill.fire{background:#ffe1d6;color:#9a3412;border-color:#f2a98a}
body.noside aside{display:none}
.mapw{overflow-x:auto;background:#ffffff0d;border-radius:12px}
.map{background:linear-gradient(120deg,#1c1747,#123a3a);border-radius:18px;padding:16px;color:#e8e6ff;margin-top:6px}
.map svg{display:block;width:100%;min-width:700px}.nd{cursor:pointer}.nd:focus-visible circle{stroke:#ffd166}
.chip.dk{background:#1b1740;color:#e8e6ff;border-color:#1b1740}.chip.dk[aria-pressed=true]{background:#b7a4e8;color:#1b1740;border-color:#b7a4e8}
.sub{border-radius:16px;padding:16px 18px;color:#fff;margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sub .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:#14112e}
.sub .pc{margin-left:auto;text-align:right;min-width:140px;font-size:.85rem}.sub .track{background:#ffffff26;margin-top:4px}
.lg3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.lc{background:linear-gradient(160deg,#1f1a4a,#15123a);color:#e8e6ff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lc.lk{opacity:.55;filter:grayscale(.4)}.lc .btn.p{background:#5ecfc4;color:#061e21;border-color:#5ecfc4}

.opt.sel{border-color:var(--tl);background:var(--rs);font-weight:600}
.sub,.sub b{color:#fff}.sub .sm{color:#ffffffcc}

aside{height:100vh;height:100dvh}
@media(max-width:800px){
 aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ffffff22;flex-wrap:nowrap;gap:0}
 .brand{display:none}

 aside nav button{flex:1 0 auto;width:auto;min-width:66px;text-align:center;font-size:.68rem;padding:6px 6px;min-height:50px;flex-direction:column;justify-content:center;gap:2px;white-space:nowrap}
 aside nav button span:first-child{font-size:1.15rem}
 main{padding-bottom:100px}.sub .pc{margin-left:0;width:100%}#net{display:none}.top h1{font-size:1.1rem}

}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}@keyframes flt{50%{transform:translateY(-7px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-30deg)}85%{transform:rotate(12deg)}}
@keyframes talk{50%{transform:scaleY(2.8)}}@keyframes pls{50%{opacity:.35;transform:scale(1.5)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes drift{to{transform:translate(3%,2%) scale(1.15)}}@keyframes fall{to{transform:translateY(105vh) rotate(var(--r))}}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 20%,#5ecfc430,transparent 40%),radial-gradient(circle at 85% 75%,#b7a4e830,transparent 42%);animation:drift 12s ease-in-out infinite alternate}
.enter section>*{animation:up .55s both}.enter section>:nth-child(2){animation-delay:.07s}.enter section>:nth-child(3){animation-delay:.14s}.enter section>:nth-child(4){animation-delay:.21s}.enter section>:nth-child(n+5){animation-delay:.28s}
.enter .lc{animation:up .5s .2s both}.enter .fill{animation:grow .9s ease-out}
.card,.lc,.sub,.btn,.opt,.chip{transition:transform .2s,box-shadow .2s,background-color .15s,border-color .15s,color .15s}
.card:hover,.lc:hover{transform:translateY(-3px);box-shadow:0 12px 26px #0f766e22}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.96)}.chip:hover{transform:scale(1.06)}
.opt:hover:not(:disabled){transform:translateX(5px)}.opt.good{animation:pop .4s}.opt.bad{animation:shk .35s}
.pill.fire{animation:pop .6s both}.brand .lg{transition:transform .5s}.brand:hover .lg{transform:rotate(360deg)}
aside nav button{transition:transform .2s,background-color .15s}aside nav button:hover{transform:translateX(4px)}
.map{background-size:200% 100%}.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:99;border-radius:2px;animation:fall 1.9s ease-in forwards}
#rbt{position:fixed;right:14px;bottom:14px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}#rbt>*{pointer-events:auto}
.bub{position:relative;max-width:270px;background:var(--sf);color:var(--ink);border:2px solid var(--tl);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:.92rem;box-shadow:0 10px 30px #0003;animation:pop .35s both}
.bub .chips{margin-top:8px}.bub .chip{min-height:30px;font-size:.8rem;padding:2px 10px}
.rbody{background:none;border:0;padding:0;cursor:pointer;animation:flt 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px #0003)}
.rb .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite;fill:#5ecfc4}
.rb .mouth{transform-box:fill-box;transform-origin:center;fill:#5ecfc4}.rb.talk .mouth{animation:talk .28s infinite}
.rb .ant{transform-box:fill-box;transform-origin:center;animation:pls 1.6s infinite;fill:#5ecfc4}
.rb .arm{transform-box:fill-box;transform-origin:50% 8%;animation:wave 5s infinite}.rb.talk .arm{animation:wave .8s infinite}
.rb .brow{opacity:0;stroke:#ff6b6b;stroke-width:4;stroke-linecap:round}.rb .chk{opacity:0}
.rb[data-m=strict] .brow{opacity:1}.rb[data-m=strict] .eye,.rb[data-m=strict] .mouth,.rb[data-m=strict] .ant{fill:#ff6b6b}.rb[data-m=soft] .chk{opacity:.9}
#wel{position:fixed;inset:0;z-index:100;background:#0d0b24d9;display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px);overflow:auto}#wel .card{max-width:460px;width:100%;margin:0;animation:pop .5s both}
@media(max-width:800px){#rbt{bottom:78px}}.bub{max-width:min(270px,calc(100vw - 28px))}@media(max-width:480px){.rbody svg{width:72px;height:84px}}
@media(prefers-reduced-motion:reduce){*,body::before{animation:none!important}}
</style>

<script>
const TO=['alg','mech','code','chem','bio','eng'];
const TN={alg:['Algebra','Алгебра','Algebra'],mech:['Mexanika','Механика','Mechanics'],code:['Dasturlash asoslari','Основы программирования','Programming basics'],chem:['Kimyo','Химия','Chemistry'],bio:['Biologiya','Биология','Biology'],eng:['Ingliz tili','Английский язык','English']};
// Question bank (editable): correct option is always listed first; display order is shuffled.
const QB=[
['alg',1,'a',['2x + 6 = 14. x = ?','2x + 6 = 14. x = ?','2x + 6 = 14. x = ?'],[4,3,5,8],['2x = 8, demak x = 4.','2x = 8, значит x = 4.','2x = 8, so x = 4.']],
['alg',1,'b',['3x = 21. x = ?','3x = 21. x = ?','3x = 21. x = ?'],[7,6,8,18],['x = 21 ÷ 3 = 7.','x = 21 ÷ 3 = 7.','x = 21 ÷ 3 = 7.']],
['alg',2,'a',['(x + 3)(x − 3) = ?','(x + 3)(x − 3) = ?','(x + 3)(x − 3) = ?'],['x² − 9','x² + 9','x² − 6x + 9','x² − 6'],['Kvadratlar ayirmasi: x² − 3².','Разность квадратов: x² − 3².','Difference of squares: x² − 3².']],
['alg',2,'b',['x² = 49. Musbat x = ?','x² = 49. Положительное x = ?','x² = 49. Positive x = ?'],[7,14,6,9],['7 · 7 = 49.','7 · 7 = 49.','7 · 7 = 49.']],
['alg',3,'a',['x² − 5x + 6 = 0 ildizlari?','Корни x² − 5x + 6 = 0?','Roots of x² − 5x + 6 = 0?'],['2 va 3','1 va 6','−2 va −3','−1 va 6'],['(x − 2)(x − 3) = 0.','(x − 2)(x − 3) = 0.','(x − 2)(x − 3) = 0.']],
['alg',3,'b',['x² − 7x + 10 = 0 ildizlari yig‘indisi?','Сумма корней x² − 7x + 10 = 0?','Sum of roots of x² − 7x + 10 = 0?'],[7,10,'−7',3],['Viyet teoremasi: yig‘indi = 7.','По теореме Виета: сумма = 7.','By Vieta: the sum is 7.']],
['mech',1,'a',['2 soatda 120 km. Tezlik (km/soat)?','120 км за 2 ч. Скорость (км/ч)?','120 km in 2 h. Speed (km/h)?'],[60,240,120,30],['v = s / t = 120 / 2 = 60.','v = s / t = 120 / 2 = 60.','v = s / t = 120 / 2 = 60.']],
['mech',1,'b',['15 m/s tezlikda 4 s. Masofa (m)?','15 м/с в течение 4 с. Путь (м)?','15 m/s for 4 s. Distance (m)?'],[60,19,11,3.75],['s = v · t = 15 · 4 = 60.','s = v · t = 15 · 4 = 60.','s = v · t = 15 · 4 = 60.']],
['mech',2,'a',['F = 10 N, m = 2 kg. a (m/s²)?','F = 10 Н, m = 2 кг. a (м/с²)?','F = 10 N, m = 2 kg. a (m/s²)?'],[5,20,12,0.2],['a = F / m = 5.','a = F / m = 5.','a = F / m = 5.']],
['mech',2,'b',['m = 5 kg, a = 3 m/s². F (N)?','m = 5 кг, a = 3 м/с². F (Н)?','m = 5 kg, a = 3 m/s². F (N)?'],[15,8,1.7,2],['F = m · a = 15.','F = m · a = 15.','F = m · a = 15.']],
['mech',3,'a',['Tinch holatdan 2 s erkin tushish (g = 10). Masofa (m)?','Свободное падение 2 с из покоя (g = 10). Путь (м)?','Free fall from rest for 2 s (g = 10). Distance (m)?'],[20,10,40,5],['s = g·t² / 2 = 10·4 / 2 = 20.','s = g·t² / 2 = 10·4 / 2 = 20.','s = g·t² / 2 = 10·4 / 2 = 20.']],
['mech',3,'b',['m = 4 kg, v = 3 m/s. Kinetik energiya (J)?','m = 4 кг, v = 3 м/с. Кинетическая энергия (Дж)?','m = 4 kg, v = 3 m/s. Kinetic energy (J)?'],[18,12,36,6],['E = m·v² / 2 = 4·9 / 2 = 18.','E = m·v² / 2 = 4·9 / 2 = 18.','E = m·v² / 2 = 4·9 / 2 = 18.']],
['code',1,'a',['print(2 + 3 * 2) nimani chiqaradi?','Что выведет print(2 + 3 * 2)?','What does print(2 + 3 * 2) output?'],[8,10,7,12],['Avval ko‘paytirish: 3 · 2 = 6, keyin 2 + 6 = 8.','Сначала умножение: 3 · 2 = 6, затем 2 + 6 = 8.','Multiplication first: 3 · 2 = 6, then 2 + 6 = 8.']],
['code',1,'b',['10 % 3 nimaga teng?','Чему равно 10 % 3?','What is 10 % 3?'],[1,3,0,3.3],['% — bo‘lishdan qoldiq: 10 = 3·3 + 1.','% — остаток от деления: 10 = 3·3 + 1.','% is the remainder: 10 = 3·3 + 1.']],
['code',2,'a',['for i in range(4): print(i) necha marta chop etadi?','Сколько раз for i in range(4): print(i) выведет число?','How many times does for i in range(4): print(i) print?'],[4,3,5,0],['i = 0, 1, 2, 3 — jami 4 marta.','i = 0, 1, 2, 3 — всего 4 раза.','i = 0, 1, 2, 3 — 4 times.']],
['code',2,'b',['len([5, 6, 7, 8, 9]) = ?','len([5, 6, 7, 8, 9]) = ?','len([5, 6, 7, 8, 9]) = ?'],[5,4,9,0],['len elementlar sonini beradi.','len возвращает число элементов.','len returns the number of elements.']],
['code',3,'a',['x = 0; for i in range(1, 4): x += i. x = ?','x = 0; for i in range(1, 4): x += i. x = ?','x = 0; for i in range(1, 4): x += i. x = ?'],[6,10,3,4],['1 + 2 + 3 = 6.','1 + 2 + 3 = 6.','1 + 2 + 3 = 6.']],
['code',3,'b',['Ikkilik 101 o‘nlikda necha?','Двоичное 101 в десятичной?','Binary 101 in decimal?'],[5,3,6,101],['4 + 0 + 1 = 5.','4 + 0 + 1 = 5.','4 + 0 + 1 = 5.']]];

const S3=z=>z.split("|");
QB.push(...[

   else{const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);DB.users[f.email]=newUser(f.name,salt,await hashPw(pw,salt));ME.name=f.name;saveMe();DB.sess=f.email;V={n:'lessons',a:null};ui={};save();return render()}}
   else{const u=DB.users[f.email];if(!u||u.hash!==await hashPw(pw,u.salt))er.top=x('Pochta yoki parol noto‘g‘ri.','Неверная почта или пароль.','Email or password is incorrect.');

 if(id==='f-prefs'){const u=U(),er={},nm=v('pname').trim(),mn=Number(v('minutes'));

const MS={soft:['🌸 Muloyim','🌸 Мягкий','🌸 Gentle'],friend:['😊 Do‘stona','😊 Дружелюбный','😊 Friendly'],strict:['🔥 Qattiqqo‘l','🔥 Строгий','🔥 Strict']};

const PH={
hi:{soft:"Salom, {n}! Men sizning mentoringizman. Shoshilmang, har qadamni birga bosamiz 🌸|Привет, {n}! Я ваш ментор. Не спешите, пойдём шаг за шагом 🌸|Hi {n}! I’m your mentor. No rush, we’ll go step by step 🌸",friend:"Salom, {n}! Bugun birga zo‘r ish qilamiz. Tayyormisiz? 🚀|Привет, {n}! Сегодня сделаем крутую работу вместе. Готовы? 🚀|Hey {n}! Let’s do something great today. Ready? 🚀",strict:"{n}, vaqt qimmat. Reja tayyor, bahona yo‘q. Boshladik! 🔥|{n}, время дорого. План готов, без отговорок. Начали! 🔥|{n}, time is precious. The plan is ready, no excuses. Let’s go! 🔥"},
right:{soft:"Barakalla! Juda yaxshi ketyapsiz 💜|Молодец! У вас отлично получается 💜|Well done! You’re doing lovely 💜",friend:"Zo‘r! Mana bu boshqa gap! 🎉|Супер! Вот это дело! 🎉|Awesome! Now we’re talking! 🎉",strict:"To‘g‘ri. Shu sur’atni ushlang, to‘xtamang.|Верно. Держите темп, не останавливайтесь.|Correct. Keep that pace, don’t stop."},
wrong:{soft:"Hechqisi yo‘q, xato o‘rganishning bir qismi. Izohni o‘qib ko‘ring 🌼|Ничего страшного, ошибки — часть обучения. Прочитайте пояснение 🌼|It’s okay, mistakes are part of learning. Read the note 🌼",friend:"Oz qoldi! Izohni o‘qing, keyingisini bosib ketamiz 💪|Чуть-чуть не хватило! Читайте пояснение и дальше 💪|So close! Read the note and we’ll nail the next one 💪",strict:"Xato. Diqqat qiling! Izohni yaxshilab o‘qing va takrorlamang.|Ошибка. Внимательнее! Прочитайте пояснение и не повторяйте.|Wrong. Focus! Read the explanation and don’t repeat it."},
pass:{soft:"Dars tugadi! Siz bilan faxrlanaman 🌟|Урок пройден! Горжусь вами 🌟|Lesson complete! I’m proud of you 🌟",friend:"Dars yutildi! XP sizniki, keyingisiga o‘tamizmi? ⚡|Урок взят! XP ваши, идём дальше? ⚡|Lesson crushed! XP is yours. Next one? ⚡",strict:"Yaxshi, lekin bu hali boshlanishi. Keyingi dars kutyapti.|Неплохо, но это лишь начало. Следующий урок ждёт.|Good, but it’s only the start. Next lesson awaits."},
fail:{soft:"Bu safar bo‘lmadi, lekin siz qila olasiz. Yana urinamizmi? 🌷|В этот раз не вышло, но вы сможете. Попробуем ещё? 🌷|Not this time, but you can do it. Try again? 🌷",friend:"Hmm, bu safar emas. Qayta urinamiz, men sizga ishonaman! 💥|Хм, не в этот раз. Пробуем снова, я в вас верю! 💥|Hmm, not this time. Again, I believe in you! 💥",strict:"Natija yetarli emas. Materialni qayta o‘qing va yana urining.|Результата мало. Перечитайте материал и попробуйте снова.|Not good enough. Re-read the material and try again."},
nudge:{soft:"Charchamadingizmi? Xohlasangiz, bitta qisqa dars qilamiz ☕|Не устали? Если хотите — один короткий урок ☕|Tired? We can do one short lesson if you like ☕",friend:"Hoy, 5 daqiqa ham yetadi. Bitta mashq qilamizmi? 😄|Эй, хватит и 5 минут. Сделаем упражнение? 😄|Hey, even 5 minutes counts. One quick exercise? 😄",strict:"Nega to‘xtadingiz? Reja kutyapti. Davom eting!|Почему остановились? План ждёт. Продолжайте!|Why did you stop? The plan is waiting. Keep going!"}};

if(window.speechSynthesis){loadV();speechSynthesis.onvoiceschanged=loadV}
const vsc=v=>(/natural|neural|online|google|enhanced|premium/i.test(v.name)?4:0)+(v.localService?0:1)+(/madina|svetlana|dariya|aria|jenny|samantha|milena|female/i.test(v.name)?1:0);
function pickV(){const g=['uz','ru','en'][li()],alt=g==='uz'?['uz','tr']:[g];
 for(const p of alt){const c=VX.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(p)).sort((x1,y)=>vsc(y)-vsc(x1));if(c.length)return c[0]}return null}
let UNL=0,PEND=null;
['pointerdown','touchend','keydown','click'].forEach(k=>addEventListener(k,()=>{if(UNL||!window.speechSynthesis)return;UNL=1;try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}if(PEND){const q=PEND;PEND=null;speak(q)}},true));
function speak(s){if(ME.v===false||!window.speechSynthesis)return;if(!UNL){PEND=s;return}
 const v=pickV();let t=s.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'').replace(/\s+/g,' ').trim();
 if(v&&v.lang.toLowerCase().startsWith('tr'))t=t.replace(/[‘’ʻ`]/g,'');
 const parts=(t.match(/[^.!?]+[.!?]*/g)||[t]).map(z=>z.trim()).filter(Boolean);
 const go=()=>parts.forEach(z=>{const u=new SpeechSynthesisUtterance(z);if(v){u.voice=v;u.lang=v.lang}else u.lang=['uz-UZ','ru-RU','en-US'][li()];
  u.rate=ME.m==='strict'?1:.93;u.pitch=ME.m==='soft'?1.1:ME.m==='strict'?.95:1;speechSynthesis.speak(u)});
 try{speechSynthesis.resume();if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,80)}else go()}catch(e){}}
function type(s){const b=$('#bub'),t=$('#bt'),r=$('#rbt'),ch=[...s];clearInterval(tmr);b.hidden=false;t.textContent='';let i=0;r.classList.add('talk');

 <button class="btn p full">${x('Boshlaymiz','Начнём','Let’s go')}</button></form>`;if(!nv)$('#wn').focus()}
function confetti(){for(let i=0;i<30;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360} 80% 60%);animation-delay:${Math.random()*.4}s;--r:${Math.random()*720-360}deg`;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}
